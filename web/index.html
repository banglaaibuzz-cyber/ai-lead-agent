<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Lead Agent</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 18px;background:#f7f7f8;color:#171717}
    h1{margin-bottom:6px}.muted{color:#666}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #00000008}
    form{display:flex;gap:10px;flex-wrap:wrap}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #bbb}input{flex:1;min-width:260px}button{cursor:pointer;background:#171717;color:white;border-color:#171717}
    .lead{border-top:1px solid #eee;padding:18px 0}.lead:first-child{border-top:0}.score{font-weight:700}.pill{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;margin:3px;font-size:13px}
    a{color:inherit}.error{color:#b00020}.loading{opacity:.65}
  </style>
</head>
<body>
  <h1>AI Lead Agent</h1>
  <p class="muted">Find public business signals and turn them into evidence-based B2B opportunities.</p>
  <div class="card">
    <form id="form">
      <input id="target" placeholder="e.g. dental clinics in Dhaka" required>
      <button id="go">Research leads</button>
    </form>
    <p id="status" class="muted"></p>
  </div>
  <div id="results"></div>
<script>
const form=document.querySelector('#form'), target=document.querySelector('#target'), status=document.querySelector('#status'), results=document.querySelector('#results');
form.addEventListener('submit',async e=>{e.preventDefault();results.innerHTML='';status.textContent='Researching public pages…';form.classList.add('loading');
  try{const r=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:target.value,results:5})});const data=await r.json();if(!r.ok)throw Error(data.error||'Research failed');status.textContent=`Found ${data.length} candidate leads.`;
  results.innerHTML=data.map(l=>`<div class="card lead"><h2><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></h2><div class="score">Opportunity score: ${l.score}/100</div><p>${(l.opportunities||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</p><strong>Evidence</strong><ul>${(l.evidence||[]).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted">Contact hint: <a href="${esc(l.contact_hint)}" target="_blank" rel="noopener">${esc(l.contact_hint)}</a></p></div>`).join('');
  }catch(err){status.innerHTML=`<span class="error">${esc(err.message)}</span>`}finally{form.classList.remove('loading')}});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body></html>
